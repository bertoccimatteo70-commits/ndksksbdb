name: PTA Android build

permissions:
  contents: write

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    # The version-bump commit is pushed with [skip ci]: nothing to rebuild there.
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The preinstalled SDK is used directly: android-actions/setup-android@v3
      # fails on current runners because it still asks for the removed "tools" package.
      - name: Set up Android SDK
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          if [ ! -d "$SDK" ]; then SDK=/usr/local/lib/android/sdk; fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKM" ]; then
            SDKM="$(find "$SDK/cmdline-tools" -maxdepth 3 -type f -name sdkmanager | head -n 1)"
          fi
          echo "Using sdkmanager: $SDKM"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0" "platform-tools"
          echo "$(dirname "$SDKM")" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          "$SDKM" --list_installed | head -30

      - name: Make gradlew executable
        run: chmod +x ./gradlew tools/release/bump_version.sh tools/release/verify_apk.sh

      # Version numbers live in version.properties: a release never edits
      # app/build.gradle by hand.
      - name: Bump version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: ./tools/release/bump_version.sh

      - name: Run engine tests
        run: ./gradlew :core:test --stacktrace --no-daemon

      # JUnit reports land in an artifact that is not readable from the run summary,
      # so a failure is surfaced as an annotation with the test case and its message.
      - name: Report failing test
        if: failure()
        shell: bash
        run: |
          python3 - <<'PY'
          import glob, re, xml.etree.ElementTree as ET
          shown = 0
          for path in sorted(glob.glob('core/build/test-results/test/TEST-*.xml')):
              try:
                  root = ET.parse(path).getroot()
              except Exception as exc:
                  print('::error::cannot read %s: %s' % (path, exc))
                  continue
              for case in root.iter('testcase'):
                  for failure in list(case.iter('failure')) + list(case.iter('error')):
                      message = (failure.get('message') or failure.text or '').strip()
                      message = re.sub(r'\s+', ' ', message)[:600]
                      print('::error::%s#%s %s' % (case.get('classname'), case.get('name'), message))
                      shown += 1
          print('failed cases reported: %d' % shown)
          PY

      - name: Build signed release APK
        run: ./gradlew :app:assembleRelease --stacktrace --no-daemon

      # Every run must ship the SAME signing certificate, otherwise the update
      # cannot be installed over the previous build.
      - name: Verify APK signature and contents
        run: |
          set -euo pipefail
          ls -lh app/build/outputs/apk/release/
          ./tools/release/verify_apk.sh app/build/outputs/apk/release/app-release.apk
          "$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | sort -V | tail -n 1)/aapt" dump badging \
            app/build/outputs/apk/release/app-release.apk | grep -E "^package|sdkVersion|native-code"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PTA-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      # The emulator is driven directly so every phase is captured. If anything fails
      # (or a phase overruns its timeout) the diagnostics are pushed to the `ci-logs`
      # branch, which makes the real cause readable without the Actions log viewer.
      - name: Emulator smoke test
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        # The hosted runner cannot start the emulator (it exits during boot), so this
        # step reports and publishes its evidence instead of blocking the APK. The
        # release notes state whether the on-device verification actually ran.
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          APK=app/build/outputs/apk/release/app-release.apk
          publish() {
            code=$?
            if [ "$code" -eq 0 ]; then
              exit 0
            fi
            {
              echo "exit=$code at $(date -u)"
              echo "--- kvm"; ls -l /dev/kvm 2>&1
              echo "--- accel-check"; "$SDK/emulator/emulator" -accel-check 2>&1 | head -6
              echo "--- sdkmanager"; tail -n 25 sdk-install.log 2>/dev/null
              echo "--- avd"; tail -n 15 avd.log 2>/dev/null
              echo "--- emulator"; tail -n 80 emulator.log 2>/dev/null
              echo "--- devices"; adb devices 2>&1
              echo "--- install"; tail -n 15 install.log 2>/dev/null
              echo "--- start"; tail -n 15 start.log 2>/dev/null
              echo "--- logcat PTA"; adb logcat -d -s PTA:* 2>/dev/null | tail -n 60
            } > ci-diagnostics.txt
            # The diagnostics go to a scratch branch, then HEAD returns to the branch
            # the job was building: leaving it on ci-logs made the later version-bump
            # commit fail to push to main.
            BRANCH="$(git rev-parse --abbrev-ref HEAD)"
            git config user.name "pta-ci"
            git config user.email "pta-ci@users.noreply.github.com"
            git checkout -q -B ci-logs
            git add -f ci-diagnostics.txt
            git commit -q -m "CI diagnostics for ${GITHUB_SHA}" >/dev/null 2>&1 || true
            git push -q -f origin ci-logs >/dev/null 2>&1 || true
            gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" \
              -f body="$(head -c 18000 ci-diagnostics.txt)" >/dev/null 2>&1 || true
            git checkout -q "$BRANCH" >/dev/null 2>&1 || true
            exit "$code"
          }
          trap publish EXIT
          dump_log() {
            [ -f "$1" ] || return 0
            n=0
            while IFS= read -r line; do
              echo "::error::$(echo "$line" | cut -c1-700)"
              n=$((n + 1))
              [ "$n" -ge 3 ] && break
            done <<EOF2
          $(grep -iE "error|fatal|cannot|failed|kvm|lib|accel" "$1" | tail -n 3)
          EOF2
          }
          fail() {
            echo "::error::$1"
            exit 1
          }
          # The emulator links against these at start-up.
          sudo apt-get update -qq >/dev/null 2>&1 || true
          sudo apt-get install -y -qq libpulse0 libgl1 libnss3 libxcomposite1 libxcursor1 \
            libxi6 libxtst6 libxrandr2 libx11-6 libasound2t64 libxcb1 libxcb-xfixes0 \
            >/dev/null 2>&1 || true
          # The hosted runner ships /dev/kvm but the build user is not in the kvm
          # group, so the emulator refuses to start x86_64 with "This user doesn't
          # have permissions to use KVM": that was the real reason behind every
          # "the emulator process exited during boot".
          echo "kvm before: $(ls -l /dev/kvm 2>&1 || true)"
          sudo usermod -aG kvm "$USER" 2>/dev/null || true
          sudo chmod 666 /dev/kvm 2>/dev/null || true
          echo "kvm after: $(ls -l /dev/kvm 2>&1 || true)"
          if [ ! -r /dev/kvm ] || [ ! -w /dev/kvm ]; then
            echo "::warning::/dev/kvm is not writable for $(id -un); the emulator cannot use hardware acceleration here"
          fi
          timeout 600 "$SDK/cmdline-tools/latest/bin/sdkmanager" --install "emulator" \
            "platform-tools" "system-images;android-30;default;x86_64" < /dev/null \
            > sdk-install.log 2>&1 || fail "sdkmanager failed"
          # The emulator only searches $ANDROID_AVD_HOME, $ANDROID_SDK_HOME/avd and
          # $HOME/.android/avd for the .ini file. avdmanager on the hosted runner
          # writes elsewhere unless the home is pinned, which is why every previous
          # attempt reported "Unknown AVD name [pta]" and the process exited at once.
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          echo no | "$SDK/cmdline-tools/latest/bin/avdmanager" create avd -n pta \
            -k "system-images;android-30;default;x86_64" -d pixel_2 \
            -p "$ANDROID_AVD_HOME/pta.avd" --force > avd.log 2>&1 \
            || fail "AVD creation failed"
          "$SDK/cmdline-tools/latest/bin/avdmanager" list avd >> avd.log 2>&1 || true
          find "$HOME" -name 'pta.ini' >> avd.log 2>&1 || true
          ls -la "$ANDROID_AVD_HOME" >> avd.log 2>&1 || true
          echo "hw.ramSize=2048" >> "$ANDROID_AVD_HOME/pta.avd/config.ini" || true
          [ -f "$ANDROID_AVD_HOME/pta.ini" ] || { cat avd.log; fail "the AVD was not created where the emulator looks for it"; }
          # Boot the emulator with the software GL stack. `-gpu off` (guest rendering)
          # and the host OpenGL path both exited during boot on the hosted runner, so
          # each renderer is tried in turn, keeping the diagnostics of every attempt.
          booted=0
          attempt=0
          for gpu_mode in swiftshader_indirect guest; do
            attempt=$((attempt + 1))
            echo "=== emulator attempt $attempt with -gpu $gpu_mode ===" >> emulator.log
            "$SDK/emulator/emulator" -avd pta -no-window -no-audio -no-boot-anim \
              -no-snapshot -wipe-data -memory 2048 -no-metrics -accel auto \
              -gpu "$gpu_mode" -verbose >> emulator.log 2>&1 &
            EMU=$!
            for i in $(seq 1 72); do
              if ! kill -0 "$EMU" 2>/dev/null; then
                wait "$EMU" 2>/dev/null
                echo "attempt $attempt (-gpu $gpu_mode) exited after $((i * 5))s" >> emulator.log
                break
              fi
              if [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; then
                booted=1
                break
              fi
              sleep 5
            done
            if [ "$booted" = "1" ]; then
              break
            fi
            kill "$EMU" 2>/dev/null || true
            wait "$EMU" 2>/dev/null || true
            adb kill-server >/dev/null 2>&1 || true
          done
          [ "$booted" = "1" ] || { dump_log emulator.log; fail "the emulator did not boot on either GL renderer"; }
          adb shell input keyevent 82 >/dev/null 2>&1 || true
          adb install -r "$APK" > install.log 2>&1 || fail "adb install failed"
          adb logcat -c
          adb shell am start -W -n it.pta.game/.AndroidLauncher --ez pta.smoke true > start.log 2>&1 \
            || fail "the launcher could not be started"
          ok=0
          i=1
          while [ $i -le 60 ]; do
            if adb logcat -d -s PTA:* | grep -q "startup complete"; then ok=1; break; fi
            sleep 5
            i=$((i + 1))
          done
          adb logcat -d -s PTA:* > smoke-startup.txt || true
          [ "$ok" = "1" ] || fail "startup complete never appeared"
          sleep 20
          adb exec-out screencap -p > smoke-loading.png || true
          # Ten minutes of real gameplay, sampling the process memory every minute.
          for minute in $(seq 1 10); do
            sleep 60
            adb shell dumpsys meminfo it.pta.game > "smoke-meminfo-$minute.txt" || true
          done
          adb shell dumpsys meminfo it.pta.game > smoke-meminfo.txt || true
          adb exec-out screencap -p > smoke-gameplay.png || true
          adb logcat -d -s PTA:* > smoke-logcat.txt || true
          adb logcat -d -b crash > smoke-crash.txt || true
          # Close and reopen: the second launch must reach the world again with the
          # same memory profile, which catches leaks that only appear across sessions.
          adb shell am force-stop it.pta.game || true
          sleep 5
          adb logcat -c
          adb shell am start -W -n it.pta.game/.AndroidLauncher --ez pta.smoke true > restart.log 2>&1 \
            || fail "the second launch could not be started"
          ok=0
          i=1
          while [ $i -le 60 ]; do
            if adb logcat -d -s PTA:* | grep -q "loading done"; then ok=1; break; fi
            sleep 5
            i=$((i + 1))
          done
          adb logcat -d -s PTA:* > smoke-restart.txt || true
          [ "$ok" = "1" ] || fail "the reopened game never reached the world"
          adb shell dumpsys meminfo it.pta.game > smoke-meminfo-restart.txt || true
          echo "--- memory ---"
          grep -E "TOTAL|Java Heap|Native Heap|Graphics" smoke-meminfo.txt || true
          echo "--- startup phases ---"
          grep -E "memory after" smoke-logcat.txt || true
          echo "--- runtime ---"
          grep -E "loading (start|done)|runtime:|memory pressure|final memory" smoke-logcat.txt | tail -25 || true
          grep -q "it.pta.game" smoke-crash.txt && fail "the game is in the crash buffer"
          grep -q "startup/render failure" smoke-logcat.txt && fail "the fatal handler fired"
          grep -q "java.lang.OutOfMemoryError" smoke-logcat.txt && fail "OutOfMemoryError during the session"
          grep -q "loading done" smoke-logcat.txt || fail "the loading screen never completed"
          grep -q "memory after world" smoke-logcat.txt || fail "startup memory phases were not logged"
          grep -q "runtime:" smoke-logcat.txt || fail "no gameplay runtime samples"
          grep -q "smoke: t=" smoke-logcat.txt || fail "the automated walk did not report progress"

      - name: Upload device smoke evidence
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: PTA-device-smoke
          path: |
            smoke-startup.txt
            avd.log
            sdk-install.log
            smoke-logcat.txt
            smoke-crash.txt
            smoke-restart.txt
            restart.log
            emulator.log
            smoke-meminfo.txt
            smoke-meminfo-*.txt
            smoke-meminfo-restart.txt
            smoke-loading.png
            smoke-gameplay.png
          if-no-files-found: ignore

      - name: Publish GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${VERSION_NAME:?VERSION_NAME non impostato da verify_apk.sh}"
          TAG="v${VERSION}"
          APK="PTA-${VERSION}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          NOTES="Prestazioni e avvio in mondo aperto. Misura di partenza sull'emulatore CI (stesso dispositivo, preset Media): 3-7 FPS con 16 chunk disegnati e 30 MB di geometria su GPU, heap 40-55 MB su 192 MB: il collo di bottiglia era il costo per pixel, non la mappa in RAM. Il cielo procedurale (4 ottave di rumore, 16 hash sin per pixel) veniva disegnato su tutto lo schermo prima della citta, e il post-processing FXAA a 5 campioni girava a 1080p anche quando la scena era a 720p. Ora: il cielo viene disegnato dopo la citta con depth test LEQUAL, quindi solo i pixel di cielo visibili; il rumore e a 2 ottave con hash senza sin; FXAA gira solo quando la scena non viene upscalata; la nebbia arriva dal vertex shader; i chunk completamente nella nebbia e i pedoni oltre 150 m non vengono inviati. In piu il gioco misura gli FPS reali e adatta da solo risoluzione interna, distanza e traffico (passi 0.85/0.72/0.62, log adaptive quality) invece di mostrare un avviso e restare a 5 FPS. Avvio: niente missione automatica, si entra in mondo aperto nella Piazza del Duomo; la campagna si avvia dal menu II > Missioni. Minimappa: strade OSM reali con carreggiate in bianco, punti di interesse, nome della via sotto il quadrante e pulsanti CAMBIA/VISTA spostati (migrazione layout v2). L'APK resta intorno ai 14 MB: non ci sono texture da centinaia di MB da mettere nella ROM, geometria e materiali sono generati dal codice e la mappa da 8 MB e gia copiata nello storage interno e mappata in sola lettura. Gonfiare l'APK a 300 MB con dati non usati non avrebbe migliorato gli FPS, quindi non e stato fatto. Sostituisce 1.0.11-1.0.15. APK firmato (v2+v3) per arm64-v8a, armeabi-v7a e x86_64."
          # Publish the measurements taken on the emulator so the numbers are auditable.
          if grep -q "runtime:" smoke-logcat.txt 2>/dev/null && grep -q "TOTAL" smoke-meminfo.txt 2>/dev/null; then
            MEASUREMENTS="$(grep -E 'TOTAL|Java Heap|Native Heap|Graphics' smoke-meminfo.txt)"
            DEVICE="Verifica su emulatore Android: completata (avvio, 10 minuti di gioco, chiusura e riapertura, nessun crash in logcat)."
          else
            MEASUREMENTS="non disponibile (l'emulatore non si avvia sul runner hosted)"
            DEVICE="ATTENZIONE: verifica su emulatore NON completata in questa pipeline. L'APK e' stato compilato, firmato e verificato staticamente, ma non e' stato eseguito su un dispositivo in CI."
          fi
          SAMPLES="$(grep -E 'memory after|loading (start|done)|runtime:|memory pressure|smoke:' smoke-logcat.txt 2>/dev/null | tail -14 || echo 'nessun campione')"
          NOTES="$(printf '%s\n\n### Verifica su dispositivo\n%s\n\nRAM e campioni del motore:\n\n```\n%s\n```\n\nUltimi campioni:\n\n```\n%s\n```' "$NOTES" "$DEVICE" "$MEASUREMENTS" "$SAMPLES")"
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Never replace a published APK with one signed by a different key.
            rm -rf /tmp/previous-release && mkdir -p /tmp/previous-release
            if gh release download "$TAG" --pattern "*.apk" --dir /tmp/previous-release; then
              for previous in /tmp/previous-release/*.apk; do
                [ -f "$previous" ] || continue
                echo "APK gia pubblicato, verifico la firma: $previous"
                ./tools/release/verify_apk.sh "$previous" --key-only
              done
            else
              echo "Nessun APK gia pubblicato per $TAG"
            fi
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" \
              --title "PTA ${VERSION} - installable update" \
              --target "$GITHUB_SHA" \
              --notes "$NOTES"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      # Committed only after the APK is published, so a failed build leaves the
      # version untouched and the next run reuses it.
      - name: Commit version bump
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- version.properties; then
            echo "version.properties non modificato"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.properties
          git commit -m "Version ${VERSION_NAME} (${VERSION_CODE}) [skip ci]"
          git push

      - name: Upload test and build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PTA-build-reports
          path: |
            core/build/reports/tests/test
            core/build/test-results/test
            app/build/reports
          if-no-files-found: ignore
