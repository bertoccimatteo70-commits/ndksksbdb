name: PTA Android build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install platform and build tools
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run engine tests
        run: ./gradlew :core:test --stacktrace --no-daemon

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        run: |
          ls -lh app/build/outputs/apk/debug/
          unzip -l app/build/outputs/apk/debug/app-debug.apk | head -40

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PTA-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload test and build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PTA-build-reports
          path: |
            core/build/reports/tests/test
            core/build/test-results/test
            app/build/reports
          if-no-files-found: ignore
