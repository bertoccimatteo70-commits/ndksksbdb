name: PTA Android build

permissions:
  contents: write

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    # The version-bump commit is pushed with [skip ci]: nothing to rebuild there.
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The preinstalled SDK is used directly: android-actions/setup-android@v3
      # fails on current runners because it still asks for the removed "tools" package.
      - name: Set up Android SDK
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          if [ ! -d "$SDK" ]; then SDK=/usr/local/lib/android/sdk; fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKM" ]; then
            SDKM="$(find "$SDK/cmdline-tools" -maxdepth 3 -type f -name sdkmanager | head -n 1)"
          fi
          echo "Using sdkmanager: $SDKM"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0" "platform-tools"
          echo "$(dirname "$SDKM")" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          "$SDKM" --list_installed | head -30

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew tools/release/bump_version.sh tools/release/verify_apk.sh

      # Version numbers live in version.properties: a release never edits
      # app/build.gradle by hand.
      - name: Bump version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: ./tools/release/bump_version.sh

      - name: Run engine tests
        run: ./gradlew :core:test --stacktrace --no-daemon

      - name: Build signed release APK
        run: ./gradlew :app:assembleRelease --stacktrace --no-daemon

      # Every run must ship the SAME signing certificate, otherwise the update
      # cannot be installed over the previous build.
      - name: Verify APK signature and contents
        run: |
          set -euo pipefail
          ls -lh app/build/outputs/apk/release/
          ./tools/release/verify_apk.sh app/build/outputs/apk/release/app-release.apk
          "$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | sort -V | tail -n 1)/aapt" dump badging \
            app/build/outputs/apk/release/app-release.apk | grep -E "^package|sdkVersion|native-code"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PTA-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      # Real-device gate: a release is published only if the APK boots on an Android
      # emulator, survives the intro, reports its memory footprint and leaves no crash
      # in logcat. The evidence is uploaded as an artifact.
      - name: Enable KVM
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Real-device gate: the release is published only if the APK builds, boots on an
      # Android emulator, plays the game for about three minutes without crashing and
      # reports its memory footprint. The runner executes this with /usr/bin/sh, so no
      # bash-only syntax and no pipefail.
      - name: Emulator smoke test
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect
          script: |
            set -e
            adb install -r app/build/outputs/apk/release/app-release.apk
            adb logcat -c
            adb shell am start -W -n it.pta.game/.AndroidLauncher --ez pta.smoke true
            ok=0
            i=1
            while [ $i -le 60 ]; do
              if adb logcat -d -s PTA:* | grep -q "startup complete"; then ok=1; break; fi
              sleep 5
              i=$((i + 1))
            done
            adb logcat -d -s PTA:* > smoke-startup.txt || true
            if [ "$ok" != "1" ]; then
              echo "startup complete never appeared"
              tail -40 smoke-startup.txt || true
              exit 1
            fi
            echo "--- startup ---"
            grep -E "startup:|smoke:" smoke-startup.txt | tail -20 || true
            sleep 30
            adb exec-out screencap -p > smoke-loading.png || true
            sleep 150
            adb shell dumpsys meminfo it.pta.game > smoke-meminfo.txt || true
            adb exec-out screencap -p > smoke-gameplay.png || true
            adb logcat -d -s PTA:* > smoke-logcat.txt || true
            adb logcat -d -b crash > smoke-crash.txt || true
            echo "--- memory ---"
            grep -E "TOTAL|Java Heap|Native Heap|Graphics" smoke-meminfo.txt || true
            echo "--- runtime ---"
            grep -E "loading (start|done)|runtime:|memory pressure|final memory" smoke-logcat.txt | tail -25 || true
            if grep -q "it.pta.game" smoke-crash.txt; then
              tail -40 smoke-crash.txt
              echo "the game is in the crash buffer"
              exit 1
            fi
            if grep -q "startup/render failure" smoke-logcat.txt; then
              grep -A3 "startup/render failure" smoke-logcat.txt | tail -10
              echo "the fatal handler fired"
              exit 1
            fi
            grep -q "loading done" smoke-logcat.txt || { echo "the loading screen never completed"; exit 1; }
            grep -q "runtime:" smoke-logcat.txt || { echo "no gameplay runtime samples"; exit 1; }
            grep -q "smoke: walked" smoke-logcat.txt || { echo "the automated walk did not complete"; exit 1; }

      - name: Upload device smoke evidence
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: PTA-device-smoke
          path: |
            smoke-startup.txt
            smoke-logcat.txt
            smoke-crash.txt
            emulator.log
            smoke-meminfo.txt
            smoke-loading.png
            smoke-gameplay.png
          if-no-files-found: ignore

      - name: Publish GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${VERSION_NAME:?VERSION_NAME non impostato da verify_apk.sh}"
          TAG="v${VERSION}"
          APK="PTA-${VERSION}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          NOTES="Installable update: the APK is now signed with one stable release key (v2+v3) instead of a fresh CI debug key, so each new build installs over the previous one. Uninstall the old 1.0.5 once, then updates work normally. Same game content as 1.0.5: asphalt with shoulders, kerbs, sidewalks and markings at LOD 0/1/2; exact polygon-edge collision; substepped player and full-footprint vehicle sweeps; safe interior exits; road-graph GPS with a no-route state. All 71.844 buildings, 26.296 roads, 17.679 drivable elements, areas, POIs and 70 interiors preserved. Includes the JVM suite for map integrity, routing, NPC collision, saves and streaming caches. APK: arm64-v8a, armeabi-v7a, x86_64."
          # Publish the measurements taken on the emulator so the numbers are auditable.
          MEASUREMENTS="$(grep -E 'TOTAL|Java Heap|Native Heap|Graphics' smoke-meminfo.txt 2>/dev/null || echo 'meminfo non disponibile')"
          SAMPLES="$(grep -E 'loading (start|done)|runtime:|memory pressure|smoke:' smoke-logcat.txt 2>/dev/null | tail -10 || echo 'nessun campione')"
          NOTES="$(printf '%s\n\n### Verifica su emulatore Android (API 30, x86_64, SwiftShader)\nPartita reale avviata e giocata per circa 3 minuti, nessun crash in logcat.\n\n```\n%s\n```\n\nCampioni del motore:\n\n```\n%s\n```' "$NOTES" "$MEASUREMENTS" "$SAMPLES")"
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Never replace a published APK with one signed by a different key.
            rm -rf /tmp/previous-release && mkdir -p /tmp/previous-release
            if gh release download "$TAG" --pattern "*.apk" --dir /tmp/previous-release; then
              for previous in /tmp/previous-release/*.apk; do
                [ -f "$previous" ] || continue
                echo "APK gia pubblicato, verifico la firma: $previous"
                ./tools/release/verify_apk.sh "$previous" --key-only
              done
            else
              echo "Nessun APK gia pubblicato per $TAG"
            fi
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" \
              --title "PTA ${VERSION} - installable update" \
              --target "$GITHUB_SHA" \
              --notes "$NOTES"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      # Committed only after the APK is published, so a failed build leaves the
      # version untouched and the next run reuses it.
      - name: Commit version bump
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- version.properties; then
            echo "version.properties non modificato"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.properties
          git commit -m "Version ${VERSION_NAME} (${VERSION_CODE}) [skip ci]"
          git push

      - name: Upload test and build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PTA-build-reports
          path: |
            core/build/reports/tests/test
            core/build/test-results/test
            app/build/reports
          if-no-files-found: ignore
