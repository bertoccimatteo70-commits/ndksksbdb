name: PTA Android build

permissions:
  contents: write

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The preinstalled SDK is used directly: android-actions/setup-android@v3
      # fails on current runners because it still asks for the removed "tools" package.
      - name: Set up Android SDK
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          if [ ! -d "$SDK" ]; then SDK=/usr/local/lib/android/sdk; fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKM" ]; then
            SDKM="$(find "$SDK/cmdline-tools" -maxdepth 3 -type f -name sdkmanager | head -n 1)"
          fi
          echo "Using sdkmanager: $SDKM"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0" "platform-tools"
          echo "$(dirname "$SDKM")" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          "$SDKM" --list_installed | head -30

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run engine tests
        run: ./gradlew :core:test --stacktrace --no-daemon

      - name: Build signed release APK
        run: ./gradlew :app:assembleRelease --stacktrace --no-daemon

      # Every run must ship the SAME signing certificate, otherwise the update
      # cannot be installed over the previous build.
      - name: Verify APK signature and contents
        run: |
          set -euo pipefail
          ls -lh app/build/outputs/apk/release/
          ./tools/release/verify_apk.sh app/build/outputs/apk/release/app-release.apk
          "$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | sort -V | tail -n 1)/aapt" dump badging \
            app/build/outputs/apk/release/app-release.apk | grep -E "^package|sdkVersion|native-code"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PTA-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${VERSION_NAME:?VERSION_NAME non impostato da verify_apk.sh}"
          TAG="v${VERSION}"
          APK="PTA-${VERSION}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          NOTES="Installable update: the APK is now signed with one stable release key (v2+v3) instead of a fresh CI debug key, so each new build installs over the previous one. Uninstall the old 1.0.5 once, then updates work normally. Same game content as 1.0.5: asphalt with shoulders, kerbs, sidewalks and markings at LOD 0/1/2; exact polygon-edge collision; substepped player and full-footprint vehicle sweeps; safe interior exits; road-graph GPS with a no-route state. All 71.844 buildings, 26.296 roads, 17.679 drivable elements, areas, POIs and 70 interiors preserved. Includes 20 JVM tests. APK: arm64-v8a, armeabi-v7a, x86_64."
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Never replace a published APK with one signed by a different key.
            rm -rf /tmp/previous-release && mkdir -p /tmp/previous-release
            if gh release download "$TAG" --pattern "*.apk" --dir /tmp/previous-release; then
              for previous in /tmp/previous-release/*.apk; do
                [ -f "$previous" ] || continue
                echo "APK gia pubblicato, verifico la firma: $previous"
                ./tools/release/verify_apk.sh "$previous" --key-only
              done
            else
              echo "Nessun APK gia pubblicato per $TAG"
            fi
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" \
              --title "PTA ${VERSION} - installable update" \
              --target "$GITHUB_SHA" \
              --notes "$NOTES"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Upload test and build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PTA-build-reports
          path: |
            core/build/reports/tests/test
            core/build/test-results/test
            app/build/reports
          if-no-files-found: ignore
