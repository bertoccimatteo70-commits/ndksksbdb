plugins {
    id 'com.android.application'
}

configurations {
    natives
}

android {
    namespace 'it.pta.game'
    compileSdk 34

    defaultConfig {
        applicationId 'it.pta.game'
        minSdk 24
        targetSdk 34
        versionCode 6
        versionName '1.0.5'
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['libs']
            assets.srcDirs = ['src/main/assets']
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }

    lint {
        abortOnError false
    }
}

dependencies {
    implementation project(':core')
    implementation 'com.badlogicgames.gdx:gdx-backend-android:1.12.1'
    implementation 'com.badlogicgames.gdx:gdx-freetype:1.12.1'
    implementation 'com.badlogicgames.gdx-controllers:gdx-controllers-core:2.2.2'
    implementation 'com.badlogicgames.gdx-controllers:gdx-controllers-android:2.2.2'

    // Native payloads: extracted into app/libs/<abi> by copyAndroidNatives.
    natives 'com.badlogicgames.gdx:gdx-platform:1.12.1:natives-arm64-v8a'
    natives 'com.badlogicgames.gdx:gdx-platform:1.12.1:natives-armeabi-v7a'
    natives 'com.badlogicgames.gdx:gdx-platform:1.12.1:natives-x86_64'
    natives 'com.badlogicgames.gdx:gdx-freetype-platform:1.12.1:natives-arm64-v8a'
    natives 'com.badlogicgames.gdx:gdx-freetype-platform:1.12.1:natives-armeabi-v7a'
    natives 'com.badlogicgames.gdx:gdx-freetype-platform:1.12.1:natives-x86_64'
}

tasks.register('copyAndroidNatives') {
    doFirst {
        file('libs/arm64-v8a').mkdirs()
        file('libs/armeabi-v7a').mkdirs()
        file('libs/x86_64').mkdirs()
    }
    doLast {
        configurations.natives.files.each { jar ->
            def outputDir = null
            if (jar.name.endsWith('natives-arm64-v8a.jar')) {
                outputDir = file('libs/arm64-v8a')
            } else if (jar.name.endsWith('natives-armeabi-v7a.jar')) {
                outputDir = file('libs/armeabi-v7a')
            } else if (jar.name.endsWith('natives-x86_64.jar')) {
                outputDir = file('libs/x86_64')
            }
            if (outputDir != null) {
                copy {
                    from zipTree(jar)
                    into outputDir
                    include '*.so'
                }
            }
        }
        logger.lifecycle("PTA native libraries: " + file('libs').listFiles()?.collect { it.name + "=" + (it.list()?.length ?: 0) })
    }
}

preBuild.dependsOn(copyAndroidNatives)
