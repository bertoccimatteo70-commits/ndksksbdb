plugins {
    id 'com.android.application'
}

configurations {
    natives
}

// One stable distribution key, so every APK can be installed over the previous one.
// The keystore can be overridden by environment variables for a private setup.
def ptaKeystoreFile = System.getenv('PTA_KEYSTORE_FILE')
        ? file(System.getenv('PTA_KEYSTORE_FILE'))
        : rootProject.file('keystore/pta-release.jks')
def ptaKeystorePassword = System.getenv('PTA_KEYSTORE_PASSWORD') ?: 'pta-distribution-2026'
def ptaKeyAliasName = System.getenv('PTA_KEY_ALIAS') ?: 'pta'
def ptaKeyPasswordValue = System.getenv('PTA_KEY_PASSWORD') ?: ptaKeystorePassword
def hasPtaKeystore = ptaKeystoreFile.exists()
if (!hasPtaKeystore) {
    logger.warn("PTA: keystore di distribuzione assente (${ptaKeystoreFile}); la build release usera la chiave debug.")
}

android {
    namespace 'it.pta.game'
    compileSdk 34

    defaultConfig {
        applicationId 'it.pta.game'
        minSdk 24
        targetSdk 34
        versionCode 7
        versionName '1.0.6'
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        if (hasPtaKeystore) {
            release {
                storeFile ptaKeystoreFile
                storePassword ptaKeystorePassword
                keyAlias ptaKeyAliasName
                keyPassword ptaKeyPasswordValue
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            signingConfig hasPtaKeystore ? signingConfigs.release : signingConfigs.debug
        }
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['libs']
            assets.srcDirs = ['src/main/assets']
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }

    lint {
        abortOnError false
    }
}

dependencies {
    implementation project(':core')
    implementation 'com.badlogicgames.gdx:gdx-backend-android:1.12.1'
    implementation 'com.badlogicgames.gdx:gdx-freetype:1.12.1'
    implementation 'com.badlogicgames.gdx-controllers:gdx-controllers-core:2.2.2'
    implementation 'com.badlogicgames.gdx-controllers:gdx-controllers-android:2.2.2'

    // Native payloads: extracted into app/libs/<abi> by copyAndroidNatives.
    natives 'com.badlogicgames.gdx:gdx-platform:1.12.1:natives-arm64-v8a'
    natives 'com.badlogicgames.gdx:gdx-platform:1.12.1:natives-armeabi-v7a'
    natives 'com.badlogicgames.gdx:gdx-platform:1.12.1:natives-x86_64'
    natives 'com.badlogicgames.gdx:gdx-freetype-platform:1.12.1:natives-arm64-v8a'
    natives 'com.badlogicgames.gdx:gdx-freetype-platform:1.12.1:natives-armeabi-v7a'
    natives 'com.badlogicgames.gdx:gdx-freetype-platform:1.12.1:natives-x86_64'
}

tasks.register('copyAndroidNatives') {
    doFirst {
        file('libs/arm64-v8a').mkdirs()
        file('libs/armeabi-v7a').mkdirs()
        file('libs/x86_64').mkdirs()
    }
    doLast {
        configurations.natives.files.each { jar ->
            def outputDir = null
            if (jar.name.endsWith('natives-arm64-v8a.jar')) {
                outputDir = file('libs/arm64-v8a')
            } else if (jar.name.endsWith('natives-armeabi-v7a.jar')) {
                outputDir = file('libs/armeabi-v7a')
            } else if (jar.name.endsWith('natives-x86_64.jar')) {
                outputDir = file('libs/x86_64')
            }
            if (outputDir != null) {
                copy {
                    from zipTree(jar)
                    into outputDir
                    include '*.so'
                }
            }
        }
        logger.lifecycle("PTA native libraries: " + file('libs').listFiles()?.collect { it.name + "=" + (it.list()?.length ?: 0) })
    }
}

preBuild.dependsOn(copyAndroidNatives)
